#################################
### Hibernate Connection Pool ###
#################################

dbconfig.hibernate.connection.pool_size=80

###########################
### C3P0 Connection Pool###
###########################

dbconfig.hibernate.c3p0.max_size=80
dbconfig.hibernate.c3p0.min_size=4
dbconfig.hibernate.c3p0.initialSize=4
dbconfig.hibernate.c3p0.timeout=600
#dbconfig.hibernate.c3p0.max_statements 100
dbconfig.hibernate.c3p0.idle_test_period=300
dbconfig.hibernate.c3p0.acquire_increment=2
dbconfig.hibernate.c3p0.validate=false




