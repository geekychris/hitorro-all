#dbconfig.hibernate.connection.provider_class org.hibernate.connection.DriverManagerConnectionProvider
#dbconfig.hibernate.connection.provider_class org.hibernate.connection.DatasourceConnectionProvider
#dbconfig.hibernate.connection.provider_class org.hibernate.connection.C3P0ConnectionProvider
#dbconfig.hibernate.connection.provider_class org.hibernate.connection.DBCPConnectionProvider
#dbconfig.hibernate.connection.provider_class org.hibernate.connection.ProxoolConnectionProvider



#######################
### Transaction API ###
#######################

## Enable automatic flush during the JTA beforeCompletion() callback
## (This setting is relevant with or without the Transaction API)

#hibernate.transaction.flush_before_completion


## Enable automatic session close at the end of transaction
## (This setting is relevant with or without the Transaction API)

#hibernate.transaction.auto_close_session


## the Transaction API abstracts application code from the underlying JTA or JDBC transactions

#hibernate.transaction.factory_class org.hibernate.transaction.JTATransactionFactory
#hibernate.transaction.factory_class org.hibernate.transaction.JDBCTransactionFactory


## to use JTATransactionFactory, Hibernate must be able to locate the UserTransaction in JNDI
## default is java:comp/UserTransaction
## you do NOT need this setting if you specify hibernate.transaction.manager_lookup_class

#jta.UserTransaction jta/usertransaction
#jta.UserTransaction javax.transaction.UserTransaction
#jta.UserTransaction UserTransaction


## to use the second-level cache with JTA, Hibernate must be able to obtain the JTA TransactionManager

#hibernate.transaction.manager_lookup_class org.hibernate.transaction.JBossTransactionManagerLookup
#hibernate.transaction.manager_lookup_class org.hibernate.transaction.WeblogicTransactionManagerLookup
#hibernate.transaction.manager_lookup_class org.hibernate.transaction.WebSphereTransactionManagerLookup
#hibernate.transaction.manager_lookup_class org.hibernate.transaction.OrionTransactionManagerLookup
#hibernate.transaction.manager_lookup_class org.hibernate.transaction.ResinTransactionManagerLookup



##############################
### Miscellaneous Settings ###
##############################

## print all generated SQL to the console

#hibernate.show_sql true


## add comments to the generated SQL

#hibernate.use_sql_comments true


## generate statistics

#hibernate.generate_statistics true


## auto schema export

# DISABLED: Using JPA schema-generation instead to avoid repeated drops
#dbconfig.hibernate.hbm2ddl.auto=create
#hibernate.hbm2ddl.auto create
#hibernate.hbm2ddl.auto update


## specify a default schema and catalog for unqualified tablenames

#hibernate.default_schema test
#hibernate.default_catalog test
#dbconfig.hibernate.connection.characterEncoding=utf8
#dbconfig.hibernate.connection.useUnicode=true
#dbconfig.hibernate.use_sql_comments=true
#dbconfig.hibernate.show_sql=true
## enable ordering of SQL UPDATEs by primary key

dbconfig.hibernate.order_updates=true


## set the maximum depth of the outer join fetch tree

dbconfig.hibernate.max_fetch_depth=1


## set the default batch size for batch fetching

dbconfig.hibernate.default_batch_fetch_size=8


## rollback generated identifier values of deleted entities to default values

#hibernate.use_identifer_rollback true


## enable CGLIB reflection optimizer (enabled by default)

#hibernate.cglib.use_reflection_optimizer true



#####################
### JDBC Settings ###
#####################

## specify a JDBC isolation level

#hibernate.connection.isolation 4


## enable JDBC autocommit (not recommended!)

#hibernate.connection.autocommit true


## set the JDBC fetch size

#hibernate.jdbc.fetch_size 25


## set the maximum JDBC 2 batch size (a nonzero value enables batching)

#hibernate.jdbc.batch_size 5


## enable batch updates even for versioned data

dbconfig.hibernate.jdbc.batch_versioned_data=true


## enable use of JDBC 2 scrollable ResultSets (specifying a Dialect will cause Hibernate to use a sensible default)

#hibernate.jdbc.use_scrollable_resultset true


## use streams when writing binary types to / from JDBC

dbconfig.hibernate.jdbc.use_streams_for_binary=true


## use JDBC 3 PreparedStatement.getGeneratedKeys() to get the identifier of an inserted row

#hibernate.jdbc.use_get_generated_keys false


## choose a custom JDBC batcher

# hibernate.jdbc.factory_class


## enable JDBC result set column alias caching 
## (minor performance enhancement for broken JDBC drivers)

# hibernate.jdbc.wrap_result_sets


## choose a custom SQL exception converter

#hibernate.jdbc.sql_exception_converter



##########################
### LongSecond-level Cache ###
##########################

## optimize chache for minimal "puts" instead of minimal "gets" (good for clustered cache)

#hibernate.cache.use_minimal_puts true


## set a prefix for cache region names

#hibernate.cache.region_prefix hibernate.test


## disable the second-level cache

#hibernate.cache.use_second_level_cache false


## enable the query cache

#hibernate.cache.use_query_cache true


## store the second-level cache entries in a more human-friendly format

#hibernate.cache.use_structured_entries true


## choose a cache implementation

#dbconfig.hibernate.cache.provider_class org.hibernate.cache.EhCacheProvider
#hdbconfig.ibernate.cache.provider_class org.hibernate.cache.EmptyCacheProvider
#dbconfig.hibernate.cache.provider_class=org.hibernate.cache.HashtableCacheProvider
#dbconfig.hibernate.cache.provider_class org.hibernate.cache.TreeCacheProvider
#dbconfig.hibernate.cache.provider_class org.hibernate.cache.OSCacheProvider
#dbconfig.hibernate.cache.provider_class org.hibernate.cache.SwarmCacheProvider


## choose a custom query cache implementation

#hibernate.cache.query_cache_factory



